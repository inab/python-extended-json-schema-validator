[build-system]
requires = [
	"setuptools>=42",
	"wheel"
]
build-backend = "setuptools.build_meta"

[mypy]
warn_redundant_casts=true
warn_unused_ignores=true

[tool.yapf]
based_on_style="pep8"
continuation_align_style="valign-right"
dedent_closing_brackets=true
force_multiline_dict=true
spaces_around_dict_delimiters=true
spaces_around_list_delimiters=true
split_all_comma_separated_values=true
use_tabs=true

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
ignore = [
	"BLE001",
	"C401",
	"C402",
	"C405",
	"C408",
	"C417",
	"EXE001",
	"FLY002",
	"FURB188",
	"I001",
	"PIE790",
	"PIE808",
	"PLR1730",
	"PYI032",
	"RUF009",
	"RUF015",
	"RUF022",
	"RUF059",
	"SIM102",
	"SIM114",
	"SIM115",
	"SIM117",
	"TRY002",
	"UP006",
	"UP007",
	"UP009",
	"UP030",
	"UP032",
	"UP035",
	"UP036",
	"UP037",
	"UP043",
	"UP045"
]